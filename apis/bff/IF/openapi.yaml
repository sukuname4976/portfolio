openapi: 3.0.0
info:
  title: BFF API
  version: 1.0.0
  description: Backend for Frontend (BFF) の API 仕様
servers:
  - url: http://localhost:8000
    description: 本番相当のローカル実行先。`make up` で本番向けに最適化した状態で起動した際の接続先。
  - url: http://localhost:8080
    description: 開発用ローカル実行先。`make dev` で開発向け機能 (ホットリロード等) を有効にして起動した際の接続先。
paths:
  /health:
    $ref: "paths/health.yaml"
  /api/v1/echo:
    $ref: "paths/echo.yaml"
  /api/v1/users:
    $ref: "paths/users.yaml"
  /api/v1/users/{id}:
    $ref: "paths/user.yaml"
components:
  schemas:
    EchoRequest:
      $ref: "components/schemas/echo.yaml#/EchoRequest"
    EchoResponse:
      $ref: "components/schemas/echo.yaml#/EchoResponse"
    EchoData:
      $ref: "components/schemas/echo.yaml#/EchoData"
    PokemonData:
      $ref: "components/schemas/pokemon.yaml#/PokemonData"
    TypeData:
      $ref: "components/schemas/pokemon.yaml#/TypeData"
    UserResponse:
      $ref: "components/schemas/user.yaml#/UserResponse"
    UserData:
      $ref: "components/schemas/user.yaml#/UserData"
    CreateUserRequest:
      $ref: "components/schemas/user.yaml#/CreateUserRequest"
    ErrorResponse:
      $ref: "components/schemas/error.yaml#/ErrorResponse"
