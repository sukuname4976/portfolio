openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: ユーザーサービスの API 仕様
servers:
  - url: http://localhost:8000
    description: 本番相当のローカル実行先。`make up` で本番向けに最適化した状態で起動した際の接続先。
  - url: http://localhost:8081
    description: 開発用ローカル実行先。`make dev` で開発向け機能 (ホットリロード等) を有効にして起動した際の接続先。
paths:
  /:
    $ref: "paths/health.yaml"
  /api/v1/users/{id}:
    $ref: "paths/user.yaml"
components:
  schemas:
    UserResponse:
      $ref: "components/schemas/user.yaml#/UserResponse"
    UserData:
      $ref: "components/schemas/user.yaml#/UserData"
    ErrorResponse:
      $ref: "components/schemas/error.yaml#/ErrorResponse"
