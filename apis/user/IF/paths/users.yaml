post:
  summary: Create user
  operationId: createUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/user.yaml#/CreateUserRequest"
  responses:
    "201":
      description: User created
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yaml#/UserResponse"
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../components/schemas/error.yaml#/ErrorResponse"
    "409":
      description: Email already exists
      content:
        application/json:
          schema:
            $ref: "../components/schemas/error.yaml#/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../components/schemas/error.yaml#/ErrorResponse"
